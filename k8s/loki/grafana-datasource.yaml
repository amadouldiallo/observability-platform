# =============================================================================
# Datasource Grafana — Loki, même mécanisme que le Prometheus du Projet 2
# =============================================================================
# Voir k8s/finops/grafana-datasource.yaml (dépôt gitops-platform) pour
# l'explication complète du choix "ConfigMap + sidecar" plutôt que l'écran
# "Add data source" de Grafana — repris ici à l'identique, uid fixé pour
# rester référençable depuis un futur dashboard sans dépendre d'un id
# généré aléatoirement à l'import.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: grafana
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
